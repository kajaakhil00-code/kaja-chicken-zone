<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaja's Chicken Zone</title>
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #d9534f;
        }
        .menu-card {
            background: white;
            padding: 15px;
            margin: 10px auto;
            width: 300px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        button {
            background-color: #5cb85c;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>

    <h1>Kaja's Chicken Zone 🍗</h1>
    <p>ఫ్రెష్ అండ్ జ్యూసీ చికెన్ ఆర్డర్ చేయండి!</p>

    <!-- మెనూ ఐటమ్ -->
    <div class="menu-card">
        <h3>Fresh Chicken (1 Kg)</h3>
        <p>ధర: ₹250/-</p>
        <button onclick="startPayment()">ఆర్డర్ & పేమెంట్ చేయండి</button>
    </div>

    <script>
        function startPayment() {
            var options = {
                "key": "Rzp_live_TMT03OyoVLSYZS", // నీ లైవ్ రేజర్‌పే కీ
                "amount": "25000", // 250 రూపాయలు (పైసాలో)
                "currency": "INR",
                "name": "Kaja's Chicken Zone",
                "description": "Chicken Purchase Payment",
                "handler": function (response){
                    alert("సక్సెస్! పేమెంట్ ఐడి: " + response.razorpay_payment_id);
                    // పేమెంట్ సక్సెస్ అయ్యాక డేటాబేస్‌లో సేవ్ చేసుకునే కోడ్ ఇక్కడ రాసుకోవచ్చు
                },
                "prefill": {
                    "name": "Kaja",
                    "email": "kaja@example.com",
                    "contact": "9876543210"
                },
                "theme": {
                    "color": "#d9534f"
                }
            };
            var rzp1 = new Razorpay(options);
            rzp1.open();
        }
    </script>

</body>
</html>
